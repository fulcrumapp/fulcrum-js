name: Publish npm package to GitHub Packages

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-npm-publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish to GitHub Packages
    if: (github.event_name == 'create' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - uses: $/.github/actions/npm-publish-github
        with:
          token: ${{ github.token }}

  release:
    name: Create GitHub release notes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: $/.github/actions/npm-create-release
        env:
          GH_TOKEN: ${{ github.token }}
