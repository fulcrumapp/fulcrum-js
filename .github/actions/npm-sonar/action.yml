name: Scan npm package with SonarQube
description: Restore coverage and scan a trusted npm revision using the Sonar scanner image.
inputs:
  artifact-name:
    description: Name of the coverage artifact for this run.
    required: true
  token:
    description: Sonar authentication token.
    required: true
  host-url:
    description: Sonar host URL.
    required: false
    default: https://sonarcloud.io
  restore-path:
    description: Repository-relative destination for the artifact contents.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Download coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/npm-sonar-reports
        digest-mismatch: error
    - name: Restore coverage
      shell: bash
      env:
        RESTORE_PATH: ${{ inputs.restore-path }}
      run: |
        set -euo pipefail
        test -d "$RUNNER_TEMP/npm-sonar-reports"
        [[ "$RESTORE_PATH" != /* && "/$RESTORE_PATH/" != *"/../"* ]] || {
          echo "::error::Report destination must be repository-relative"
          exit 1
        }
        mkdir -p "$GITHUB_WORKSPACE/$RESTORE_PATH"
        cp -a "$RUNNER_TEMP/npm-sonar-reports/." "$GITHUB_WORKSPACE/$RESTORE_PATH/"
    - name: Scan trusted revision
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
        SONAR_USER_HOME: /tmp/sonar
        HOME: /tmp
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
      run: |
        set -euo pipefail
        test -n "$SONAR_TOKEN" || { echo "::error::A Sonar token is required"; exit 1; }
        test -n "$SONAR_HOST_URL" || { echo "::error::A Sonar host URL is required"; exit 1; }
        args=("-Dsonar.scm.revision=$GITHUB_SHA")
        if [[ "$EVENT_NAME" == pull_request ]]; then
          test -n "$PR_NUMBER" && test -n "$PR_HEAD" && test -n "$PR_BASE"
          args+=("-Dsonar.pullrequest.key=$PR_NUMBER" "-Dsonar.pullrequest.branch=$PR_HEAD" "-Dsonar.pullrequest.base=$PR_BASE")
        elif [[ "$EVENT_NAME" == merge_group ]]; then
          test -n "$MERGE_GROUP_REF"
          args+=("-Dsonar.branch.name=${MERGE_GROUP_REF#refs/heads/}")
        fi
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --env SONAR_TOKEN --env SONAR_HOST_URL --env SONAR_USER_HOME --env HOME \
          --volume "$GITHUB_WORKSPACE:/usr/src" \
          sonarsource/sonar-scanner-cli@sha256:46341f2c2dc560381414e90347885f5cddc716db080adcbafc1cac13e1473094 \
          "${args[@]}"
